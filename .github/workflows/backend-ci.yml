name: Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [develop]

jobs:
  check-changes:
    name: Check Backend Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'chatweb_be/**'
              - '.github/workflows/backend-ci.yml'

  test-and-verify:
    name: Backend Test & Verification
    needs: check-changes
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Skip Backend CI
        if: needs.check-changes.outputs.backend != 'true'
        run: echo "Không có thay đổi trong Backend. Bỏ qua kiểm tra Backend."

      - name: Checkout Code
        if: needs.check-changes.outputs.backend == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        if: needs.check-changes.outputs.backend == 'true'
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Grant execute permission for mvnw
        if: needs.check-changes.outputs.backend == 'true'
        run: chmod +x chatweb_be/mvnw

      - name: Compile Backend
        if: needs.check-changes.outputs.backend == 'true'
        run: |
          cd chatweb_be
          ./mvnw clean compile

      - name: Run Unit Tests
        if: needs.check-changes.outputs.backend == 'true'
        run: |
          cd chatweb_be
          ./mvnw test

      - name: Publish Test Report
        if: needs.check-changes.outputs.backend == 'true' && always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: "chatweb_be/target/surefire-reports/*.xml"

      - name: Cache SonarCloud packages
        if: needs.check-changes.outputs.backend == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: SonarCloud Code Analysis
        if: needs.check-changes.outputs.backend == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd chatweb_be
          ./mvnw -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.host.url=https://sonarcloud.io
