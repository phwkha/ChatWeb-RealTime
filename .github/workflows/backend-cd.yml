name: Backend CD

on:
  push:
    branches: [main]
    paths:
      - "chatweb_be/**"
      - ".github/workflows/backend-cd.yml"

jobs:
  build-and-push-docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Grant execute permission for mvnw
        run: chmod +x chatweb_be/mvnw

      - name: Generate Short SHA
        id: vars
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "short_sha=sha-${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "Building Docker image with tags: latest, sha-${SHORT_SHA}"

      - name: Build & Push to Docker Hub with Jib
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          cd chatweb_be
          ./mvnw compile jib:build \
            -Djib.to.tags=${{ steps.vars.outputs.short_sha }} \
            -Djib.to.image=${{ secrets.DOCKER_USERNAME }}/chatweb-backend:latest
