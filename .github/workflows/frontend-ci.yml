name: Frontend CI

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'chatweb_fe/**'
      - '.github/workflows/frontend-ci.yml'
  push:
    branches: [ develop ]
    paths:
      - 'chatweb_fe/**'
      - '.github/workflows/frontend-ci.yml'

jobs:
  frontend-verify:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4.2.0
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'chatweb_fe/package-lock.json'

      - name: Install Dependencies
        run: |
          cd chatweb_fe
          npm ci

      - name: Lint Code with Oxlint
        run: |
          cd chatweb_fe
          npm run lint

      - name: Build with Vite
        run: |
          cd chatweb_fe
          npm run build
