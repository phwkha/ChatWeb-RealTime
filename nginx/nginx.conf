events { 
    worker_connections 1024; 
}

http {
    # Rate Limiting Zones (10MB holds ~160,000 IPs)
    limit_req_zone $binary_remote_addr zone=global_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
    limit_req_status 429;

    upstream backend_servers {
        least_conn;
        server cw_backend:8443;
    }

    server {
        listen 80;
        
        location = /test-chat.html {
            root /usr/share/nginx/html;
        }

        # Auth endpoints rate limiting (Login, Register, OTP, etc.)
        location /api/auth/ {
            limit_req zone=auth_limit burst=5 nodelay;

            proxy_pass https://backend_servers;
            
            proxy_ssl_trusted_certificate /etc/nginx/ssl/rootCA.crt;
            proxy_ssl_verify on;
            proxy_ssl_server_name off;
            proxy_ssl_name cw_backend;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            limit_req zone=global_limit burst=20 nodelay;

            proxy_pass https://backend_servers;
            
            proxy_ssl_trusted_certificate /etc/nginx/ssl/rootCA.crt;
            proxy_ssl_verify on;
            proxy_ssl_server_name off;
            proxy_ssl_name cw_backend;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket Support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Resolver Docker DNS nội bộ (giúp Nginx khởi động bình thường kể cả khi Grafana/Kibana tắt)
        resolver 127.0.0.11 valid=30s ipv6=off;

        location /grafana/ {
            set $grafana_upstream http://grafana:3000;
            proxy_pass $grafana_upstream;
            proxy_set_header Host $host;
            
            # WebSocket Support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /kibana/ {
            set $kibana_upstream http://kibana:5601;
            proxy_pass $kibana_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
