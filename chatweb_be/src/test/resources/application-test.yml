spring:
  main:
    allow-circular-references: true
  cache:
    type: none
  data:
    mongodb:
      auto-index-creation: false
      uri: mongodb://localhost:27017/test
    redis:
      host: localhost
      port: 6379
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: dummy
            client-secret: dummy
  mail:
    host: dummy
    username: dummy
    expiration-minutes: 5
  kafka:
    admin:
      auto-create: false
    listener:
      auto-startup: false
    topic:
      friend:
        friend-topic: dummy
        friend-group-id: dummy
      chat:
        messages: dummy
        system-messages: dummy
        save: dummy
        messages-group-id: dummy
        system-messages-group-id: dummy
        messages-save-group-id: "test-messages-save-group"
      update-message:
        update: "test-update-message"
        group-id: "test-update-message-group"
      email:
        email-topic: dummy
        group-id: dummy
    properties:
      schema.registry.url: mock://test-schema-registry

cloudinary:
  cloud-name: dummy
  api-key: dummy
  api-secret: dummy

app:
  cors:
    allowed-origins: "http://localhost:3000"
  upload:
    avatar:
      max-size: 1048576
    max-size-video: 1048576
    max-size-image: 1048576
  oauth2:
    redirect-uri: dummy

jwt:
  expiry-minutes: 5
  expiry-day: 1
  secret-key-access: ZHVtbXktc2VjcmV0LWtleS10aGF0LWlzLWF0LWxlYXN0LTMyLWJ5dGVzLWxvbmctZm9yLWhtYWM=

openapi:
  service:
    api-docs: dummy
    title: dummy
    version: dummy
    server: dummy
