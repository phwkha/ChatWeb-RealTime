spring:
  config:
    activate:
      on-profile: dev

  data:
    mongodb:
      uri: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@${MONGO_HOST}:27017/${MONGO_DB}?authSource=admin
      auto-index-creation: true
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
    cache:
      type: redis
      redis:
        time-to-live: 10m
        cache-null-values: false
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    hibernate:
      ddl-auto: update
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${USERNAME_EMAIL}
    password: ${PASSWORD_EMAIL}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
    expiration-minutes: 5
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    topic:
      chat:
        messages: chat-messages
        system-messages: chat-system-messages
        messages-save-group-id: chat-save-group
        messages-group-id: chat-websocket-group
        system-messages-group-id: system-websocket-group
      update-message:
        update: message-update
        group-id: message-update-group-id
      email:
        email-topic: email-messages
        group-id: email-worker-group
      friend:
        friend-topic: friend-notifications
        friend-group-id: friend-websocket-group
    properties:
      schema.registry.url: ${SCHEMA_REGISTRY_URL}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

openapi:
  service:
    api-docs: backend
    title: Backend API document
    version: v1.0.0
    server: ${OPENAPI_SERVER_URL}

jwt:
  secret-key-access: ${JWT_SECRET_ACCESS}
  secret-key-refresh: ${JWT_SECRET_REFRESH}
  expiry-minutes: 60
  expiry-day: 7

cloudinary:
  cloud-name: ${CLOUDINARY_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

app:
  oauth2:
    redirect-uri: ${OAUTH2_REDIRECT_URI}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}
  upload:
    avatar:
      max-size: 5242880
    max-size-video: 20971520
    max-size-image: 20971520
  admin:
    default-password: ${APP_ADMIN_DEFAULT_PASSWORD:Admin@123Seeder!}

logging:
  level:
    root: INFO
    com.web.backend: DEBUG
    org.springframework.web: INFO
    org.springframework.kafka: INFO
