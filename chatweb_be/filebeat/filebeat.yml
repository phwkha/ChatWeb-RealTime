filebeat.inputs:
- type: filestream
  id: chatweb-logs
  enabled: true
  paths:
    - /usr/share/filebeat/logs/*.log
  ignore_older: 48h
  clean_inactive: 72h
  close_inactive: 5m
  parsers:
    - ndjson:
        keys_under_root: true
        add_error_key: true
        message_key: message

output.logstash:
  hosts: ["logstash:5044"]
