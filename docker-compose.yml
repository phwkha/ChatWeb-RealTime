services:
  # --- MONGODB ---
  cw_mongo:
    image: mongo:latest
    container_name: mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
      - mongo_config_data:/data/configdb
      - ./chatweb_be/mongo/init:/docker-entrypoint-initdb.d
    networks:
      - default

  # --- POSTGRESQL ---
  cw_postgres:
    image: postgres:latest
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./chatweb_be/initdb.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - default

  # --- REDIS ---
  cw_redis:
    image: redis/redis-stack:latest
    container_name: redis
    hostname: redis
    ports:
      - "127.0.0.1:6379:6379"
      - "127.0.0.1:8001:8001"
    environment:
      - REDIS_ARGS=--requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - default

  # --- KAFKA BROKER 1 ---
  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: chat-kafka-1
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093,2@kafka2:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      CLUSTER_ID: ${CLUSTER_ID}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
    volumes:
      - kafka_data:/var/lib/kafka/data
      - kafka_secrets:/etc/kafka/secrets

  # --- KAFKA BROKER 2 ---
  kafka2:
    image: confluentinc/cp-kafka:latest
    container_name: chat-kafka-2
    ports:
      - "127.0.0.1:9094:9092"
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka2:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093,2@kafka2:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      CLUSTER_ID: ${CLUSTER_ID}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
    volumes:
      - kafka2_data:/var/lib/kafka/data
      - kafka2_secrets:/etc/kafka/secrets

  # --- SCHEMA REGISTRY ---
  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.0
    container_name: schema-registry
    restart: always
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:9092,kafka2:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    networks:
      - default
    depends_on:
      - kafka
      - kafka2

  # --- FILEBEAT ---
  filebeat:
    profiles: ["monitoring"]
    image: docker.elastic.co/beats/filebeat:8.10.4
    container_name: filebeat
    user: root
    command: filebeat -e -strict.perms=false
    volumes:
      - ./chatweb_be/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ./chatweb_be/logs:/usr/share/filebeat/logs:ro
    networks:
      - default
    depends_on:
      - logstash

  # --- ELASTICSEARCH ---
  elasticsearch:
    profiles: ["monitoring"]
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.4
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:9200:9200"
    networks:
      - default

  # --- LOGSTASH ---
  logstash:
    profiles: ["monitoring"]
    image: docker.elastic.co/logstash/logstash:8.10.4
    container_name: logstash
    ports:
      - "127.0.0.1:5000:5000"
      - "127.0.0.1:5044:5044"
    volumes:
      - ./chatweb_be/logstash/pipeline:/usr/share/logstash/pipeline
    environment:
      - "LS_JAVA_OPTS=-Xms256m -Xmx256m"
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
    networks:
      - default
    depends_on:
      - elasticsearch

  # --- KIBANA ---
  kibana:
    profiles: ["monitoring"]
    image: docker.elastic.co/kibana/kibana:8.10.4
    container_name: kibana
    ports:
      - "127.0.0.1:5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${ELASTIC_PASSWORD}
      - SERVER_BASEPATH=/kibana
      - SERVER_REWRITEBASEPATH=true
    networks:
      - default
    depends_on:
      - elasticsearch

  # --- PROMETHEUS ---
  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./chatweb_be/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - default
    depends_on:
      - cw_backend

  # --- GRAFANA ---
  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_SERVER_ROOT_URL=http://localhost:8080/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - default
    depends_on:
      - prometheus

  # --- NGINX LOAD BALANCER CHO BACKEND ---
  nginx_lb:
    image: nginx:alpine
    container_name: nginx_load_balancer
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl/ca/rootCA.crt:/etc/nginx/ssl/rootCA.crt:ro
      - ./test-chat.html:/usr/share/nginx/html/test-chat.html:ro
    networks:
      - default
    depends_on:
      - cw_backend

  # --- SPRING BOOT BACKEND ---
  cw_backend:
    image: ${DOCKER_USERNAME}/chatweb-backend:latest
    expose:
      - "8443"
    environment:
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_DB: ${MONGO_DB}
      MONGO_USER: ${MONGO_USER}
      MONGO_PASSWORD: ${MONGO_PASSWORD}

      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      JWT_SECRET_ACCESS: ${JWT_SECRET_ACCESS}
      JWT_SECRET_REFRESH: ${JWT_SECRET_REFRESH}

      SPRING_DATA_MONGODB_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@cw_mongo:27017/${MONGO_DB}?authSource=admin
      SPRING_DATASOURCE_URL: jdbc:postgresql://cw_postgres:5432/${POSTGRES_DB}

      SPRING_DATA_REDIS_HOST: cw_redis
      SPRING_DATA_REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}

      USERNAME_EMAIL: ${USERNAME_EMAIL}
      PASSWORD_EMAIL: ${PASSWORD_EMAIL}

      CLOUDINARY_NAME: ${CLOUDINARY_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}

      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      SCHEMA_REGISTRY_URL: ${SCHEMA_REGISTRY_URL:-http://schema-registry:8081}
      CLUSTER_ID: ${CLUSTER_ID}

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      OAUTH2_REDIRECT_URI: ${OAUTH2_REDIRECT_URI}

      APP_CORS_ALLOWED_ORIGINS: ${FRONTEND_URL}
      OPENAPI_SERVER_URL: ${OPENAPI_SERVER_URL}

      SPRING_PROFILES_ACTIVE: dev

      SERVER_PORT: 8443
      SERVER_SSL_ENABLED: "true"
      SERVER_SSL_KEY_STORE: file:/app/ssl/backend-keystore.p12
      SERVER_SSL_KEY_STORE_PASSWORD: ${BACKEND_SSL_PASSWORD}
      SERVER_SSL_KEY_STORE_TYPE: PKCS12
    volumes:
      - ./chatweb_be/logs:/app/logs
      - ./ssl/backend:/app/ssl:ro
    networks:
      - default
    depends_on:
      - cw_mongo
      - cw_postgres
      - cw_redis
      - kafka
      - kafka2
      - schema-registry

volumes:
  mongo_data:
  mongo_config_data:
  postgres_data:
  redis_data:
  kafka_data:
  kafka_secrets:
  kafka2_data:
  kafka2_secrets:
  prometheus_data:
  grafana_data:
